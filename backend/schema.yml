        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: salarie
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - APPROUVE
          - EN_ATTENTE
          - REFUSE
        description: |-
          * `EN_ATTENTE` - En attente
          * `APPROUVE` - Approuvé
          * `REFUSE` - Refusé
      - in: query
        name: type_demande
        schema:
          type: string
          enum:
          - ABSENCE
          - ACOMPTE
          - AVANCE
          - CALENDRIER
          - CET
          - FICHE
          - HEURES_SUP
        description: |-
          * `ACOMPTE` - Acompte
          * `AVANCE` - Avance
          * `CALENDRIER` - Modification du calendrier
          * `FICHE` - Demande de fiche
          * `CET` - Paiement CET
          * `HEURES_SUP` - Paiement heures supplémentaires
          * `ABSENCE` - Absence
