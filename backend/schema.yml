      - demandes
      - demandes_approuvees
      - demandes_en_attente
      - demandes_refusees
      - fiches
      - plannings
      - pointages
      - salaries
    Adresse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        salarie:
          type: integer
          readOnly: true
        salarie_nom:
          type: string
          readOnly: true
        numero:
